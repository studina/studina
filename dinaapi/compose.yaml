services:
  pgvector:
    image: pgvector/pgvector:0.8.5-pg17
    container_name: studina_pgvector
    restart: unless-stopped

    environment:
      POSTGRES_DB: studina_rag
      POSTGRES_USER: studina
      POSTGRES_PASSWORD: studina123

    ports:
      - "5433:5432"

    volumes:
      - studina_pgvector_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U studina -d studina_rag"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studina_pgvector_data: