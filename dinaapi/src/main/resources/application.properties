spring.config.import=optional:file:./.env[.properties]

spring.application.name=dinaapi
server.port=9000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# directus.url=http://localhost:8055
# directus.admin-email=admin@example.com
# directus.admin-password=admin123456
# directus.user-role-name=Studina User
directus.url=${DIRECTUS_URL}
directus.admin-email=${DIRECTUS_EMAIL}
directus.admin-password=${DIRECTUS_PASSWORD}
directus.user-role-name=${DIRECTUS_ROLE_NAME}

# spring.ai.ollama.base-url=http://localhost:11434
# spring.ai.ollama.chat.options.model=llama3.2:3b
# spring.ai.ollama.chat.options.temperature=0.2

spring.ai.model.chat=${AI_CHAT_PROVIDER:google-genai}
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# Configuración neutral consumida por la aplicación. GEMINI_* se conserva como
# fallback para no romper los entornos existentes.
ai.chat.provider=${AI_CHAT_PROVIDER:google-genai}
ai.chat.model=${AI_CHAT_MODEL:${GEMINI_MODEL:gemini-2.5-flash}}
ai.chat.generation-model=${AI_GENERATION_MODEL:${AI_CHAT_MODEL:${GEMINI_MODEL:gemini-2.5-flash}}}
ai.chat.classification-model=${AI_CLASSIFICATION_MODEL:${AI_CHAT_MODEL:${GEMINI_MODEL:gemini-2.5-flash}}}
ai.chat.summary-model=${AI_SUMMARY_MODEL:${AI_CHAT_MODEL:${GEMINI_MODEL:gemini-2.5-flash}}}
ai.chat.temperature=${AI_CHAT_TEMPERATURE:${GEMINI_TEMPERATURE:0.2}}

spring.ai.google.genai.chat.model=${ai.chat.model}
spring.ai.google.genai.chat.temperature=${ai.chat.temperature}

# Ollama se habilita con AI_CHAT_PROVIDER=ollama. Los embeddings permanecen en
# Google para no invalidar el contenido ya indexado en pgvector.
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ai.ollama.read-timeout-seconds=${OLLAMA_READ_TIMEOUT_SECONDS:600}
spring.ai.ollama.chat.model=${ai.chat.model}
spring.ai.ollama.chat.temperature=${ai.chat.temperature}

# Las credenciales aportadas por usuarios se cifran antes de persistirlas. La
# clave debe ser Base64 y representar exactamente 32 bytes (AES-256).
ai.credentials.encryption-key=${AI_CREDENTIALS_ENCRYPTION_KEY:}

# ── PostgreSQL / pgvector ──────────────────────────────────────────────────
spring.datasource.url=${RAG_DB_URL}
spring.datasource.username=${RAG_DB_USERNAME}
spring.datasource.password=${RAG_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring AI crea la tabla vector_store y las extensiones necesarias
spring.ai.vectorstore.pgvector.initialize-schema=true

# Búsqueda por similitud coseno
spring.ai.vectorstore.pgvector.index-type=NONE
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# ── Modelo de embeddings de Google ────────────────────────────────────────
# El starter de Ollama también ofrece embeddings y los habilita si esta
# propiedad no existe. Se desactiva ese modelo genérico y se conserva el
# modelo de texto de Google que ya usa el índice actual.
spring.ai.model.embedding=none
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
spring.ai.google.genai.embedding.text.dimensions=${GEMINI_EMBEDDING_DIMENSIONS:768}
spring.ai.google.genai.embedding.text.auto-truncate=true

model.armor.enabled=${MODEL_ARMOR_ENABLED:false}
model.armor.project-id=${MODEL_ARMOR_PROJECT_ID:}
model.armor.location=${MODEL_ARMOR_LOCATION:}
model.armor.template-id=${MODEL_ARMOR_TEMPLATE_ID:}
