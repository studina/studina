spring.config.import=optional:file:./.env[.properties]

spring.application.name=dinaapi
server.port=9000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# directus.url=http://localhost:8055
# directus.admin-email=admin@example.com
# directus.admin-password=admin123456
# directus.user-role-name=Studina User
directus.url=${DIRECTUS_URL}
directus.admin-email=${DIRECTUS_EMAIL}
directus.admin-password=${DIRECTUS_PASSWORD}
directus.user-role-name=${DIRECTUS_ROLE_NAME}

# spring.ai.ollama.base-url=http://localhost:11434
# spring.ai.ollama.chat.options.model=llama3.2:3b
# spring.ai.ollama.chat.options.temperature=0.2

spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_MODEL}
spring.ai.google.genai.chat.temperature=${GEMINI_TEMPERATURE:0.2}

# ── PostgreSQL / pgvector ──────────────────────────────────────────────────
spring.datasource.url=${RAG_DB_URL}
spring.datasource.username=${RAG_DB_USERNAME}
spring.datasource.password=${RAG_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring AI crea la tabla vector_store y las extensiones necesarias
spring.ai.vectorstore.pgvector.initialize-schema=true

# Búsqueda por similitud coseno
spring.ai.vectorstore.pgvector.index-type=NONE
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# ── Modelo de embeddings de Google ────────────────────────────────────────
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
spring.ai.google.genai.embedding.text.dimensions=${GEMINI_EMBEDDING_DIMENSIONS:768}
spring.ai.google.genai.embedding.text.auto-truncate=true

model.armor.enabled=${MODEL_ARMOR_ENABLED}
model.armor.url=${MODEL_ARMOR_URL}
model.armor.endpoint=${MODEL_ARMOR_ENDPOINT}
model.armor.api-key=${MODEL_ARMOR_API_KEY}
model.armor.project-id=${MODEL_ARMOR_PROJECT_ID}
model.armor.location=${MODEL_ARMOR_LOCATION}
model.armor.template-id=${MODEL_ARMOR_TEMPLATE_ID}
