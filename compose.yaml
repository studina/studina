
services:
  pgvector:
    image: pgvector/pgvector:0.8.5-pg17
    restart: unless-stopped
    env_file:
      - ./environment/pgvector.env
    ports:
      - "5433:5432"
    volumes:
      - studina_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studina -d studina_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  directus:
    image: directus/directus:latest
    restart: unless-stopped
    ports:
      - "8055:8055"
    env_file:
      - ./environment/directus.env
    volumes:
      - directus_database:/directus/database
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions

  dina-api:
    build:
      context: ./dinaapi
    restart: unless-stopped
    env_file:
      - ./environment/dinaapi.env
    ports:
      - "9000:9000"
    depends_on:
      pgvector:
        condition: service_healthy
      directus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://0.0.0.0:9000/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - ./environment/frontend.env
    ports:
      - "5173:5173"
    depends_on:
      dina-api:
        condition: service_healthy

volumes:
  studina_pgvector_data:
  directus_database:
  directus_uploads:
  directus_extensions:
