
services:
  pgvector:
    image: pgvector/pgvector:0.8.5-pg17
    restart: unless-stopped
    env_file:
      - ./environment/pgvector.env
    ports:
      - "5433:5432"
    volumes:
      - studina_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres: 
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5434:5432"
    env_file:
      - ./environment/postgres.env
    volumes:
      - studina_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  directus:
    image: directus/directus:latest
    restart: unless-stopped
    ports:
      - "8055:8055"
    env_file:
      - ./environment/directus.env
    depends_on:
      postgres:
        condition: service_healthy
      directus-schema:
        condition: service_completed_successfully
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
      - ./directus/schema.yaml:/directus/schema.yaml:ro
      
  directus-schema:
    image: directus/directus:12.2.0
    restart: "no"

    env_file:
      - ./environment/directus.env

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./directus/schema.yaml:/directus/schema.yaml:ro

    command:
      [
        "sh",
        "-c",
        "node /directus/cli.js bootstrap && node /directus/cli.js schema apply --yes /directus/schema.yaml"
      ]

  dina-api:
    build:
      context: ./dinaapi
    restart: unless-stopped
    env_file:
      - ./environment/dinaapi.env
    ports:
      - "9000:9000"
    depends_on:
      pgvector:
        condition: service_healthy
      directus:
        condition: service_started
      directus-schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://0.0.0.0:9000/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - ./environment/frontend.env
    ports:
      - "5173:5173"
    depends_on:
      dina-api:
        condition: service_healthy

volumes:
  studina_pgvector_data:
  directus_uploads:
  directus_extensions:
  studina_postgres_data: