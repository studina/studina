
services:
  pgvector:
    image: pgvector/pgvector:0.8.5-pg17
    restart: unless-stopped
    env_file:
      - ./environment/pgvector.env
    ports:
      - "5433:5432"
    volumes:
      - studina_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres: 
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5434:5432"
    env_file:
      - ./environment/postgres.env
    volumes:
      - studina_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  directus:
    image: directus/directus:12.4.1
    restart: unless-stopped
    ports:
      - "8055:8055"
    env_file:
      - ./environment/directus.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8055/server/ping | grep -q pong"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions

  directus-schema:
    image: alpine:3.20
    restart: "no"
    env_file:
      - ./environment/directus.env
    depends_on:
      directus:
        condition: service_healthy
    volumes:
      - ./scripts/directus-schema-migration.sh:/directus-schema-migration.sh:ro
    entrypoint: ["/bin/sh", "/directus-schema-migration.sh"]

  # Opcional: docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:0.40.0
    profiles: ["ollama"]
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    # CPU por defecto y sin publicar puertos: la API usa la red de Compose.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Termina tras preparar el modelo; el servidor conserva los archivos en su volumen.
  ollama-pull:
    image: ollama/ollama:0.40.0
    profiles: ["ollama"]
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    command: ["pull", "${OLLAMA_MODEL:-llama3.2}"]

  dina-api:
    build:
      context: ./dinaapi
    restart: unless-stopped
    env_file:
      - ./environment/dinaapi.env
    ports:
      - "9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      # La API puede usar proveedores externos aunque el perfil Ollama esté desactivado.
      pgvector:
        condition: service_healthy
      directus-schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://0.0.0.0:9000/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - ./environment/frontend.env
    ports:
      - "5173:5173"
    depends_on:
      dina-api:
        condition: service_healthy

volumes:
  studina_pgvector_data:
  directus_uploads:
  directus_extensions:
  studina_postgres_data:
  ollama_data:
