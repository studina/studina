# Overlay opcional: no se carga con `docker compose up` ni con `make dev`.
# Sólo Ollama (sin arrancar las otras aplicaciones):
#   docker compose -f compose.yaml -f compose.ollama.yaml up -d --wait ollama
# Descargar un modelo antes de seleccionarlo en el perfil de Studina:
#   docker compose -f compose.yaml -f compose.ollama.yaml exec ollama ollama pull llama3.2
# Arrancar Studina con el servidor Ollama en la misma red:
#   docker compose -f compose.yaml -f compose.ollama.yaml up -d --build
# Este overlay no cambia el proveedor/modelo global de la aplicación.
# Para usar Ollama como predeterminado, configurar AI_CHAT_PROVIDER y AI_CHAT_MODEL
# en environment/dinaapi.env; los modelos de los distintos casos de uso también
# deben existir en Ollama. Los embeddings siguen usando la configuración actual.
# Referencias oficiales:
#   https://docs.ollama.com/docker
#   https://docs.ollama.com/cli
#   https://github.com/ollama/ollama/releases/tag/v0.40.0

services:
  ollama:
    image: ollama/ollama:0.40.0
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    # CPU por defecto: no se reservan GPU ni se montan dispositivos del host.
    # Sin `ports`: Dina API accede mediante la red interna de Compose.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  dina-api:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    # No depende de Ollama: los proveedores cloud continúan siendo utilizables
    # aunque el servidor local esté detenido o todavía no tenga modelos.

volumes:
  ollama_data:
