name: Continuous integration

on:
  # Sin filtro de branches: se ejecuta con cada push a cualquier rama.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend - lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend - tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      pgvector:
        image: pgvector/pgvector:0.8.5-pg17
        env:
          POSTGRES_DB: studina_rag
          POSTGRES_USER: studina
          POSTGRES_PASSWORD: studina-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studina -d studina_rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Son valores ficticios: los tests no llaman a Gemini ni a un Directus real.
      GEMINI_API_KEY: ci-not-a-real-api-key
      GEMINI_MODEL: gemini-2.5-flash
      GEMINI_TEMPERATURE: "0.2"
      GEMINI_EMBEDDING_MODEL: gemini-embedding-2
      GEMINI_EMBEDDING_DIMENSIONS: "768"
      RAG_DB_URL: jdbc:postgresql://localhost:5432/studina_rag
      RAG_DB_USERNAME: studina
      RAG_DB_PASSWORD: studina-ci
      DIRECTUS_URL: http://localhost:8055
      DIRECTUS_EMAIL: ci@example.com
      DIRECTUS_PASSWORD: ci-not-a-real-password
      DIRECTUS_ROLE_NAME: Studina User
      MODEL_ARMOR_ENABLED: "false"

    defaults:
      run:
        working-directory: dinaapi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            dinaapi/*.gradle
            dinaapi/gradle/wrapper/gradle-wrapper.properties

      - name: Run backend tests and enforce coverage
        run: ./gradlew check --no-daemon

      - name: Upload backend test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-and-coverage-reports
          path: |
            dinaapi/build/reports/tests/test
            dinaapi/build/reports/jacoco/test
          if-no-files-found: warn
          retention-days: 14
